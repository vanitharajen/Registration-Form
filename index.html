<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Registration Form</title>
    <style>
        .error-placeholder::placeholder {
            color: red;
            opacity: 1;
        }
        .password-box {
    position: relative;
   
}


.password-box button {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    border: none;
    background: transparent;
    padding: 0;
    cursor: pointer;
}
    </style>
</head>

<body class="mt-10 p-2">
    <div class="w-full max-w-md border border-gray-300 rounded-lg p-6 mx-auto shadow-lg">
        <h1 class="mt-2 text-2xl font-bold bg-cyan-600 text-center p-4 rounded-md mb-6 text-white">Registration Form
        </h1>
        <form class="p-4 mt-2 flex flex-col gap-7 " id="myform">
            <label for="getname">Name <span class="text-red-500 ">*</span></label>
            <input type="text" id="getname" placeholder="Enter your name" name="name"
                class="w-full border border-blue-500 p-2 rounded-md focus:outline-none focus:border-2" maxlength="100">
            <label for="getemail">Email <span class="text-red-500 ">*</span></label>
            <input type="email" id="getemail" placeholder="Enter your email" name="email"
                class="w-full border border-blue-500 p-2 rounded-md focus:outline-none focus:border-2">
            <label for="getpassword">Password <span class="text-red-500 ">*</span></label>
                <div class="password-box"><input type="password" id="getpassword" placeholder="Enter your password" name="password"
                    class="w-full border border-blue-500 p-2 rounded-md focus:outline-none focus:border-2" minlength="6" maxlength="8" required>
                <button type="button" id="togglepassword" aria-label="Show password">
                    <svg xmlns="http://www.w3.org/2000/svg"
       width="18" height="18" viewBox="0 0 24 24"
       fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round">
    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
    <circle cx="12" cy="12" r="3"/>
  </svg>
                </button>
            </div>
            <button class="bg-cyan-600 font-bold text-xl text-white rounded p-2 w-1/4 cursor-pointer"
                id="submit">Submit</button>
        </form>
        <p id="Submitmessage" class="text-green-600 font-bold mt-4"></p>
    </div>
    <script src="script.js"></script>
</body>

</html>
